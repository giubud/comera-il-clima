name: Refresh climate data

on:
  workflow_dispatch:
    inputs:
      to_year:
        description: 'Ultimo anno completo; vuoto = anno precedente'
        required: false
        type: string
  schedule:
    # 1 marzo, 05:17 UTC = 06:17 italiane. Il fuso del cron è UTC.
    - cron: '17 5 1 3 *'

permissions: {}

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.report.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate target year and published archive
        id: plan
        env:
          TO_YEAR: ${{ inputs.to_year || '' }}
        run: npx --no-install tsx scripts/refresh-plan.ts
      - uses: actions/cache/restore@v6
        if: steps.plan.outputs.needed == 'true'
        with:
          path: |
            .cache/open-meteo-seasons-v2
            !.cache/open-meteo-seasons-v2/.download.lock
            !.cache/open-meteo-seasons-v2/**/*.tmp
          key: >-
            era5-v2-${{ runner.os }}-${{ hashFiles('scripts/season-source.ts',
            'scripts/open-meteo.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            era5-v2-${{ runner.os }}-${{ hashFiles('scripts/season-source.ts', 'scripts/open-meteo.ts') }}-
      - name: Download only missing years, with persisted quotas
        if: steps.plan.outputs.needed == 'true'
        env:
          FROM_YEAR: ${{ steps.plan.outputs.from }}
          TO_YEAR: ${{ steps.plan.outputs.to }}
        run: npm run data:fetch -- --all --from "$FROM_YEAR" --to "$TO_YEAR" --limit 300
      - name: Save progress and quota even after an interrupted download
        if: always() && steps.plan.outcome == 'success' && steps.plan.outputs.needed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/open-meteo-seasons-v2
            !.cache/open-meteo-seasons-v2/.download.lock
            !.cache/open-meteo-seasons-v2/**/*.tmp
          key: >-
            era5-v2-${{ runner.os }}-${{ hashFiles('scripts/season-source.ts',
            'scripts/open-meteo.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and validate complete archive
        env:
          TO_YEAR: ${{ steps.plan.outputs.to }}
        run: |
          mkdir -p .cache
          cp -R public/data .cache/data-before
          npm run data:build -- --to "$TO_YEAR"
          npm run data:validate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run source:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Summarize differences and reject changes to retained history
        id: report
        run: npx --no-install tsx scripts/refresh-report.ts
      - name: Package verified data and PR description
        if: steps.report.outputs.changed == 'true'
        run: |
          mkdir -p .cache/refresh-package
          cp -R public/data .cache/refresh-package/data
          cp .cache/data-refresh-summary.md .cache/refresh-package/summary.md
      - uses: actions/upload-artifact@v7
        if: steps.report.outputs.changed == 'true'
        with:
          name: data-refresh
          path: .cache/refresh-package/
          retention-days: 7

  propose:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: data-refresh
          path: .cache/refresh-package
      - name: Open or update the data proposal; never merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-refresh.mjs
